name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - run: bundle exec rspec
      - run: bundle exec rubocop

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - run: bundle exec rake build
      - run: ruby -c dist/eohunter.lic
      - uses: actions/upload-artifact@v4
        with:
          name: eohunter.lic
          path: |
            dist/eohunter.lic
            dist/eohunter.lic.map
          if-no-files-found: error
